<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team 16 Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Custom override to ensure the UI floats above the game canvas */
    #ui {
      position: absolute;
      z-index: 10;
      top: 15px;
      right: 15px;
      width: auto;
      max-width: 400px;
      /* Prevents it from getting too wide */
    }
  </style>
</head>

<body class="bg-light">

  <div id="ui" class="card shadow p-3 mb-5 bg-body-tertiary rounded">

    <div class="d-flex flex-wrap gap-2 mb-3">
      <button id="retryBtn" class="btn btn-sm btn-warning">Retry</button>
      <button id="restartAllBtn" class="btn btn-sm btn-outline-danger">Restart All</button>
      <button id="nextBtn" class="btn btn-sm btn-success" style="display:none;">Next Level</button>
      <button id="quitBtn" class="btn btn-sm btn-danger">Quit</button>
    </div>

    <div class="d-flex align-items-center mb-3">
      <input id="playerNameInput" type="text" class="form-control form-control-sm me-2" placeholder="Player name"
        style="width: 140px;" />
      <span id="playerInfo" class="fw-bold text-primary"></span>
    </div>

    <div class="d-flex align-items-center justify-content-end flex-wrap gap-2">

      <div class="input-group input-group-sm" style="width: 130px;">
        <span class="input-group-text">y=</span>
        <input id="equationInput" type="text" class="form-control" placeholder="i.e. mx" />
      </div>

      <div class="d-flex align-items-center">
        <label class="form-label mb-0 me-1 small text-muted">len</label>
        <input id="lengthInput" type="number" step="any" class="form-control form-control-sm" style="width: 70px;"
          placeholder="len" />
      </div>

      <button id="drawBtn" class="btn btn-sm btn-primary">Draw</button>
    </div>
  </div>

  <div id="container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
